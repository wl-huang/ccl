  <script>
  /**
   * 街機刮刮卡主程式
   * 嚴密防作弊措施：
   * 1. 整個邏輯包裝在 IIFE 閉包中，絕不將資料陣列或狀態暴露給 window
   * 2. 底層號碼使用純 Canvas 繪製，絕不在 DOM 建立任何包含號碼的標籤或 data 屬性
   * 3. 封鎖常見開發者工具熱鍵 (F12, Ctrl+Shift+I/J/C, Ctrl+U) 及右鍵選單
   * 4. 產生卡面後清空記憶體臨時數據
   */
  (() => {
    'use strict';

    // --- 音效系統 (使用 Web Audio API，無需外聯音檔) ---
    const Sound = (() => {
      let ctx = null;
      let isMuted = false;

      function getContext() {
        if (!ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) ctx = new AudioContext();
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume();
        }
        return ctx;
      }

      return {
        toggleMute() {
          isMuted = !isMuted;
          return isMuted;
        },
        isMuted() {
          return isMuted;
        },
        // 刮膜摩擦音效 (輕柔白噪音脈衝)
        playScratch() {
          if (isMuted) return;
          try {
            const ac = getContext();
            if (!ac) return;
            const bufferSize = ac.sampleRate * 0.04;
            const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = Math.random() * 2 - 1;
            }
            const noise = ac.createBufferSource();
            noise.buffer = buffer;

            const filter = ac.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1400;
            filter.Q.value = 2.0;

            const gain = ac.createGain();
            gain.gain.setValueAtTime(0.06, ac.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.04);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ac.destination);

            noise.start();
          } catch (e) {
            // 音訊在無使用者互動前可能靜音，容錯跳過
          }
        },
        // 格子揭開平滑音效
        playReveal() {
          if (isMuted) return;
          try {
            const ac = getContext();
            if (!ac) return;
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, ac.currentTime); // D5
            osc.frequency.exponentialRampToValueAtTime(880, ac.currentTime + 0.12); // A5

            gain.gain.setValueAtTime(0.12, ac.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.15);

            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start();
            osc.stop(ac.currentTime + 0.15);
          } catch (e) {}
        },
        // 勝利慶祝和弦音效
        playVictory() {
          if (isMuted) return;
          try {
            const ac = getContext();
            if (!ac) return;
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, idx) => {
              const osc = ac.createOscillator();
              const gain = ac.createGain();
              osc.type = 'triangle';
              osc.frequency.value = freq;
              const startTime = ac.currentTime + idx * 0.08;
              gain.gain.setValueAtTime(0.2, startTime);
              gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.6);
              osc.connect(gain);
              gain.connect(ac.destination);
              osc.start(startTime);
              osc.stop(startTime + 0.65);
            });
          } catch (e) {}
        }
      };
    })();

    // --- 實施前端反作弊機制 ---
    function initAntiCheat() {
      // 1. 禁用右鍵選單
      document.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        showToast('🛡️ 系統保護模式已鎖定右鍵選單');
        return false;
      });

      // 2. 封鎖常見開發者工具熱鍵 (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C, Ctrl+U)
      window.addEventListener('keydown', (e) => {
        const isCtrlOrMeta = e.ctrlKey || e.metaKey;
        if (
          e.key === 'F12' ||
          (isCtrlOrMeta && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
          (isCtrlOrMeta && (e.key === 'U' || e.key === 'u'))
        ) {
          e.preventDefault();
          e.stopPropagation();
          showToast('⚠️️ 為了遊戲公平，已停用檢視工具');
          return false;
        }
      });

      // 3. 控制台警告輸出
      if (window.console) {
        console.log(
          '%c🛑 防作弊模式已啟動%c\n本刮刮卡所有底層號碼均使用純像素繪製並封裝於獨立閉包，DOM 中無任何號碼資料。請享受真實刮卡的樂趣！',
          'color: #f43f5e; font-size: 20px; font-weight: bold;',
          'color: #a855f7; font-size: 13px;'
        );
      }
    }

    // --- 核心狀態管理 (完全不綁定至 window) ---
    let state = {
      rows: 8,
      cols: 5,
      totalCells: 40,
      targetNumber: 0,
      targetNumberFormatted: '000',
      digits: 3,
      scratchedCount: 0,
      hasWon: false,
      cells: [] // 每個格子的控制器實例
    };

    // DOM 元素引用
    const elInputRows = document.getElementById('input-rows');
    const elInputCols = document.getElementById('input-cols');
    const elInputTargetNum = document.getElementById('input-target-num');
    const elCheckAutoTarget = document.getElementById('check-auto-target');
    const elBtnDice = document.getElementById('btn-dice');
    const elBtnGenerate = document.getElementById('btn-generate');
    const elBtnReshuffle = document.getElementById('btn-reshuffle');
    const elBtnRevealAll = document.getElementById('btn-reveal-all');
    const elGridContainer = document.getElementById('grid-container');
    const elDisplayTarget = document.getElementById('display-target-number');
    const elLabelScratched = document.getElementById('label-scratched-count');
    const elLabelRange = document.getElementById('label-total-range');
    const elModalWin = document.getElementById('modal-win');
    const elModalWinBox = document.getElementById('modal-win-box');
    const elModalWinNumber = document.getElementById('modal-win-number');
    const elBtnModalClose = document.getElementById('btn-modal-close');
    const elToast = document.getElementById('toast');
    const elToastText = document.getElementById('toast-text');
    const elBtnSoundToggle = document.getElementById('btn-sound-toggle');
    const elIconSoundOn = document.getElementById('icon-sound-on');
    const elIconSoundOff = document.getElementById('icon-sound-off');

    // 格式化補零：總數若為 40，則至少補到 3 位數 (001...040)
    function formatNumber(num, digits) {
      return String(num).padStart(digits, '0');
    }

    // 計算格式位數
    function getDigits(total) {
      return Math.max(3, String(total).length);
    }

    // Fisher-Yates 隨機洗牌演算法
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // 輕量 Toast 通知
    let toastTimer = null;
    function showToast(text, icon = 'ℹ️') {
      if (toastTimer) clearTimeout(toastTimer);
      elToastText.textContent = text;
      document.getElementById('toast-icon').textContent = icon;
      elToast.classList.remove('translate-y-20', 'opacity-0');
      elToast.classList.add('translate-y-0', 'opacity-100');
      toastTimer = setTimeout(() => {
        elToast.classList.remove('translate-y-0', 'opacity-100');
        elToast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    /**
     * 單一刮刮卡格子元件
     * 架構：
     * - 外層 DOM 容器 (無任何號碼資訊)
     * - 底層 Canvas (cBase)：繪製數字與格紋背景
     * - 頂層 Canvas (cCover)：繪製金屬塗層與刮除圖形
     */
    function createScratchCell(numberVal, formattedText, onRevealed) {
      const cellWrapper = document.createElement('div');
      cellWrapper.className = 'scratch-cell relative w-full aspect-square rounded-full overflow-hidden shadow-md border border-purple-500/20 bg-slate-900 select-none';

      // 1. 底層 Canvas (純像素顯示號碼，防止 DOM 被檢查)
      const canvasBase = document.createElement('canvas');
      canvasBase.className = 'absolute inset-0 w-full h-full pointer-events-none rounded-full';
      
      // 2. 頂層遮罩 Canvas (供玩家刮除)
      const canvasCover = document.createElement('canvas');
      canvasCover.className = 'absolute inset-0 w-full h-full cursor-crosshair rounded-full z-10 transition-opacity duration-300';

      cellWrapper.appendChild(canvasBase);
      cellWrapper.appendChild(canvasCover);

      const ctxBase = canvasBase.getContext('2d');
      const ctxCover = canvasCover.getContext('2d');

      let isRevealed = false;
      let isDrawing = false;
      let lastX = 0;
      let lastY = 0;
      let checkThrottleTimer = null;
      let cellWidth = 0;
      let cellHeight = 0;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      // 初始化畫布尺寸 (高解析度 Retina 支援)
      function initDimensions() {
        const rect = cellWrapper.getBoundingClientRect();
        cellWidth = Math.max(rect.width, 36);
        cellHeight = Math.max(rect.height, 36);

        canvasBase.width = cellWidth * dpr;
        canvasBase.height = cellHeight * dpr;
        canvasCover.width = cellWidth * dpr;
        canvasCover.height = cellHeight * dpr;

        ctxBase.scale(dpr, dpr);
        ctxCover.scale(dpr, dpr);

        drawBase();
        drawCover();
      }

      // 繪製底層（白色圓盤底色 + 黑色字體，與附圖樣式一致）
      function drawBase() {
        const w = cellWidth;
        const h = cellHeight;
        ctxBase.clearRect(0, 0, w, h);

        // 柔和白色底色
        ctxBase.fillStyle = '#ffffff';
        ctxBase.beginPath();
        ctxBase.arc(w / 2, h / 2, w / 2 - 1, 0, Math.PI * 2);
        ctxBase.fill();

        // 邊緣精緻陰影內圈
        ctxBase.strokeStyle = '#e2e8f0';
        ctxBase.lineWidth = 1.5;
        ctxBase.stroke();

        // 繪製防偽斜紋微縮字底紋 (極高質感)
        ctxBase.save();
        ctxBase.strokeStyle = 'rgba(203, 213, 225, 0.4)';
        ctxBase.lineWidth = 1;
        for (let i = -w; i < w * 2; i += 6) {
          ctxBase.beginPath();
          ctxBase.moveTo(i, 0);
          ctxBase.lineTo(i + h, h);
          ctxBase.stroke();
        }
        ctxBase.restore();

        // 繪製幸運號碼 (純像素渲染，DOM 中完全無此字串)
        ctxBase.fillStyle = '#0f172a';
        ctxBase.textAlign = 'center';
        ctxBase.textBaseline = 'middle';
        // 依照圓形尺寸動態縮放字體
        const fontSize = Math.floor(w * 0.42);
        ctxBase.font = `900 ${fontSize}px 'Chakra Petch', sans-serif`;
        ctxBase.fillText(formattedText, w / 2, h / 2 + 1);
      }

      // 繪製頂層（黑銀微金屬光澤塗層 + 擬真刮膜微粒）
      function drawCover() {
        const w = cellWidth;
        const h = cellHeight;
        ctxCover.clearRect(0, 0, w, h);

        // 金屬黑漸層基底 (比照附圖深色圓圈)
        const grad = ctxCover.createRadialGradient(
          w * 0.35, h * 0.35, w * 0.05,
          w * 0.5, h * 0.5, w * 0.55
        );
        grad.addColorStop(0, '#2d2e38');
        grad.addColorStop(0.4, '#1a1b24');
        grad.addColorStop(0.85, '#12131a');
        grad.addColorStop(1, '#0b0c10');

        ctxCover.fillStyle = grad;
        ctxCover.beginPath();
        ctxCover.arc(w / 2, h / 2, w / 2, 0, Math.PI * 2);
        ctxCover.fill();

        // 噴塗微細銀光顆粒紋理 (增添仿真刮膜質感)
        ctxCover.fillStyle = 'rgba(255, 255, 255, 0.08)';
        for (let i = 0; i < 40; i++) {
          const rx = Math.random() * w;
          const ry = Math.random() * h;
          if (Math.hypot(rx - w / 2, ry - h / 2) < w / 2 - 2) {
            ctxCover.fillRect(rx, ry, 1.2, 1.2);
          }
        }

        // 外圈立體反光邊緣
        ctxCover.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctxCover.lineWidth = 1;
        ctxCover.stroke();
      }

      // 刮除筆刷設定
      function scratchAt(x, y) {
        if (isRevealed) return;
        ctxCover.save();
        ctxCover.globalCompositeOperation = 'destination-out';
        ctxCover.lineWidth = Math.max(cellWidth * 0.36, 16);
        ctxCover.lineCap = 'round';
        ctxCover.lineJoin = 'round';

        ctxCover.beginPath();
        ctxCover.moveTo(lastX, lastY);
        ctxCover.lineTo(x, y);
        ctxCover.stroke();

        // 在接觸點畫圓以消除折點生硬感
        ctxCover.beginPath();
        ctxCover.arc(x, y, ctxCover.lineWidth / 2, 0, Math.PI * 2);
        ctxCover.fill();
        ctxCover.restore();

        lastX = x;
        lastY = y;

        Sound.playScratch();
      }

      // 檢查刮除進度 (像素取樣計算透明度比率)
      function checkScratchProgress() {
        if (isRevealed) return;
        try {
          const rawW = canvasCover.width;
          const rawH = canvasCover.height;
          const imgData = ctxCover.getImageData(0, 0, rawW, rawH);
          const pixels = imgData.data;
          let transparentPixels = 0;
          let totalSampled = 0;

          // 以步長 16 抽樣加速運算
          for (let i = 3; i < pixels.length; i += 16) {
            totalSampled++;
            if (pixels[i] < 128) {
              transparentPixels++;
            }
          }

          const ratio = transparentPixels / totalSampled;
          // 若刮開面積達 40%，自動揭曉全格
          if (ratio >= 0.40) {
            revealSmoothly();
          }
        } catch (e) {
          // 容錯防護
        }
      }

      // 平滑完全揭曉該格
      function revealSmoothly(triggerCallback = true) {
        if (isRevealed) return;
        isRevealed = true;

        canvasCover.style.opacity = '0';
        canvasCover.style.pointerEvents = 'none';

        Sound.playReveal();

        setTimeout(() => {
          ctxCover.clearRect(0, 0, cellWidth, cellHeight);
        }, 320);

        if (triggerCallback && onRevealed) {
          onRevealed(numberVal, formattedText, cellWrapper);
        }
      }

      // 事件監聽 (支援 PointerEvents，相容滑鼠與手機觸控)
      function getPos(e) {
        const rect = canvasCover.getBoundingClientRect();
        return {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        };
      }

      canvasCover.addEventListener('pointerdown', (e) => {
        if (isRevealed) return;
        canvasCover.setPointerCapture(e.pointerId);
        isDrawing = true;
        const pos = getPos(e);
        lastX = pos.x;
        lastY = pos.y;
        scratchAt(pos.x, pos.y);
      });

      canvasCover.addEventListener('pointermove', (e) => {
        if (!isDrawing || isRevealed) return;
        const pos = getPos(e);
        scratchAt(pos.x, pos.y);

        // 節流抽樣計算進度
        if (!checkThrottleTimer) {
          checkThrottleTimer = setTimeout(() => {
            checkScratchProgress();
            checkThrottleTimer = null;
          }, 100);
        }
      });

      function stopDrawing(e) {
        if (!isDrawing) return;
        isDrawing = false;
        try {
          if (e && e.pointerId) canvasCover.releasePointerCapture(e.pointerId);
        } catch (err) {}
        checkScratchProgress();
      }

      canvasCover.addEventListener('pointerup', stopDrawing);
      canvasCover.addEventListener('pointercancel', stopDrawing);

      return {
        dom: cellWrapper,
        initDimensions,
        revealSmoothly,
        isRevealed: () => isRevealed,
        getNumberVal: () => numberVal,
        markAsWinner: () => {
          // 中獎金光閃爍環
          cellWrapper.classList.add('ring-4', 'ring-amber-400', 'ring-offset-2', 'ring-offset-purple-950', 'animate-pulse');
        }
      };
    }

    // --- 建立與重置刮刮卡面板 ---
    function generateCard(preserveConfig = false) {
      const rows = parseInt(elInputRows.value, 10);
      const cols = parseInt(elInputCols.value, 10);

      // 輸入校驗
      if (isNaN(rows) || rows < 1 || rows > 15) {
        showToast('列數請輸入 1 ～ 15 之間的數字', '⚠️');
        return;
      }
      if (isNaN(cols) || cols < 1 || cols > 10) {
        showToast('欄數請輸入 1 ～ 10 之間的數字', '⚠️');
        return;
      }

      const total = rows * cols;
      if (total > 150) {
        showToast('格子總數上限為 150 格，請調整行列數', '⚠️');
        return;
      }

      state.rows = rows;
      state.cols = cols;
      state.totalCells = total;
      state.digits = getDigits(total);
      state.scratchedCount = 0;
      state.hasWon = false;
      state.cells = [];

      // 決定中獎號碼
      let target = 1;
      if (elCheckAutoTarget.checked) {
        target = Math.floor(Math.random() * total) + 1;
        elInputTargetNum.value = target;
      } else {
        const manualTarget = parseInt(elInputTargetNum.value, 10);
        if (isNaN(manualTarget) || manualTarget < 1 || manualTarget > total) {
          target = Math.floor(Math.random() * total) + 1;
          elInputTargetNum.value = target;
          showToast(`自訂號碼無效，已為您隨機指定 ${formatNumber(target, state.digits)}`, '🎲');
        } else {
          target = manualTarget;
        }
      }

      state.targetNumber = target;
      state.targetNumberFormatted = formatNumber(target, state.digits);

      // 更新頂部看板顯示
      elDisplayTarget.textContent = state.targetNumberFormatted;
      elLabelScratched.textContent = `已刮開：0 / ${total}`;
      elLabelRange.textContent = `號碼範圍：${formatNumber(1, state.digits)} ～ ${formatNumber(total, state.digits)}`;

      // 產生 1 ~ (M*N) 數字陣列並隨機打散 (Fisher-Yates)
      const rawNumbers = [];
      for (let i = 1; i <= total; i++) {
        rawNumbers.push(i);
      }
      const shuffledNumbers = shuffleArray(rawNumbers);

      // 清空舊格位容器
      elGridContainer.innerHTML = '';
      elGridContainer.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

      // 依序建立每個刮卡格位
      shuffledNumbers.forEach((num) => {
        const formatted = formatNumber(num, state.digits);
        const cell = createScratchCell(num, formatted, handleCellRevealed);
        state.cells.push(cell);
        elGridContainer.appendChild(cell.dom);
      });

      // 立即銷毀記憶體中的陣列參考 (防作弊強化)
      rawNumbers.length = 0;
      shuffledNumbers.length = 0;

      // 等待 DOM 渲染完畢後初始化各格尺寸
      requestAnimationFrame(() => {
        state.cells.forEach(c => c.initDimensions());
      });

      showToast(`已生成 ${rows}×${cols} 共 ${total} 格全新刮刮卡`, '✨');
    }

    // 格子揭開時的回呼
    function handleCellRevealed(revealedNum, formattedText, cellDom) {
      state.scratchedCount++;
      elLabelScratched.textContent = `已刮開：${state.scratchedCount} / ${state.totalCells}`;

      // 中獎判定
      if (revealedNum === state.targetNumber && !state.hasWon) {
        state.hasWon = true;

        // 該格高亮閃爍
        const hitCell = state.cells.find(c => c.getNumberVal() === revealedNum);
        if (hitCell) hitCell.markAsWinner();

        // 播放勝利音效
        Sound.playVictory();

        // 噴灑慶祝彩帶
        triggerConfetti();

        // 顯示中獎彈窗
        setTimeout(() => {
          showWinModal(formattedText);
        }, 350);
      }
    }

    // 觸發全螢幕勝利彩花 (Canvas Confetti)
    function triggerConfetti() {
      if (typeof confetti !== 'function') return;
      const count = 200;
      const defaults = { origin: { y: 0.7 } };

      function fire(particleRatio, opts) {
        confetti(Object.assign({}, defaults, opts, {
          particleCount: Math.floor(count * particleRatio)
        }));
      }

      fire(0.25, { spread: 26, startVelocity: 55, colors: ['#fbbf24', '#f43f5e', '#a855f7'] });
      fire(0.2, { spread: 60 });
      fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
      fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, colors: ['#38bdf8', '#34d399'] });
      fire(0.1, { spread: 120, startVelocity: 45 });
    }

    // 顯示中獎彈窗
    function showWinModal(numText) {
      elModalWinNumber.textContent = numText;
      elModalWin.classList.remove('hidden');
      setTimeout(() => {
        elModalWinBox.classList.remove('scale-95');
        elModalWinBox.classList.add('scale-100');
      }, 10);
    }

    function closeWinModal() {
      elModalWinBox.classList.remove('scale-100');
      elModalWinBox.classList.add('scale-95');
      setTimeout(() => {
        elModalWin.classList.add('hidden');
      }, 200);
    }

    // --- 事件監聽綁定 ---
    
    // 生成按鈕
    elBtnGenerate.addEventListener('click', () => {
      generateCard();
    });

    // 重新洗牌按鈕
    elBtnReshuffle.addEventListener('click', () => {
      generateCard(true);
      showToast('已重新打散所有數字與重置刮膜', '🎲');
    });

    // 一鍵全刮開
    elBtnRevealAll.addEventListener('click', () => {
      if (state.cells.length === 0) return;
      let delay = 0;
      state.cells.forEach((cell, idx) => {
        if (!cell.isRevealed()) {
          setTimeout(() => {
            cell.revealSmoothly(true);
          }, delay);
          delay += 25; // 擬真逐格翻開視覺
        }
      });
      showToast('正在為您一鍵揭曉所有號碼...', '👁️');
    });

    // 自動指定開關
    elCheckAutoTarget.addEventListener('change', (e) => {
      elInputTargetNum.disabled = e.target.checked;
      if (!e.target.checked) {
        elInputTargetNum.focus();
      }
    });

    // 隨機重骰中獎號碼
    elBtnDice.addEventListener('click', () => {
      const max = state.totalCells || 40;
      const rnd = Math.floor(Math.random() * max) + 1;
      elInputTargetNum.value = rnd;
      state.targetNumber = rnd;
      state.targetNumberFormatted = formatNumber(rnd, state.digits);
      elDisplayTarget.textContent = state.targetNumberFormatted;
      showToast(`已重選指定號碼為：${state.targetNumberFormatted}`, '🎯');
    });

    // 音效開關切換
    elBtnSoundToggle.addEventListener('click', () => {
      const muted = Sound.toggleMute();
      if (muted) {
        elIconSoundOn.classList.add('hidden');
        elIconSoundOff.classList.remove('hidden');
        showToast('音效已靜音', '🔇');
      } else {
        elIconSoundOn.classList.remove('hidden');
        elIconSoundOff.classList.add('hidden');
        showToast('音效已開啟', '🔊');
      }
    });

    // 關閉中獎彈窗
    elBtnModalClose.addEventListener('click', closeWinModal);
    elModalWin.addEventListener('click', (e) => {
      if (e.target === elModalWin) closeWinModal();
    });

    // 視窗縮放時重新校正畫布尺寸
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        state.cells.forEach(c => c.initDimensions());
      }, 200);
    });

    // 啟動防作弊機制與開局生成預設卡片 (8 x 5 = 40 格)
    window.addEventListener('DOMContentLoaded', () => {
      initAntiCheat();
      generateCard();
    });

  })();
  </script>
</body>
</html>
